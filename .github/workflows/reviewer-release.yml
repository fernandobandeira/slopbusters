name: Release reviewer for Mac

on:
  push:
    tags: ["reviewer-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing reviewer tag, for example reviewer-v0.1.0"
        required: true
        type: string

concurrency:
  group: reviewer-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      REVIEWER_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      # Manual retries use the current release tools with the original tagged app.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.workflow_sha }}
      - name: Preserve release tools
        run: |
          mkdir -p "$RUNNER_TEMP/reviewer-release-tools"
          cp apps/desktop/scripts/notarization*.mjs "$RUNNER_TEMP/reviewer-release-tools/"
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Validate release version and signing credentials
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('apps/desktop/package.json', 'utf8'));
          if (!/^\d+\.\d+\.\d+$/.test(version) || process.env.REVIEWER_TAG !== `reviewer-v${version}`) {
            throw new Error('Use a reviewer-vX.Y.Z tag matching apps/desktop/package.json.');
          }
          for (const key of ['CSC_LINK', 'CSC_KEY_PASSWORD', 'APPLE_ID', 'APPLE_APP_SPECIFIC_PASSWORD', 'APPLE_TEAM_ID']) {
            if (!process.env[key]) throw new Error(`Missing GitHub Actions secret: ${key}`);
          }
          JS
          git merge-base --is-ancestor HEAD origin/main
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit:check
      - run: pnpm dedupe:check
      - run: pnpm licenses:check
      - run: pnpm lint
      - run: pnpm test
      - name: Test notarization recovery
        run: node --test "$RUNNER_TEMP/reviewer-release-tools/notarization.test.mjs"
      - name: Find saved notarization submission
        id: checkpoint
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node "$RUNNER_TEMP/reviewer-release-tools/notarization-cli.mjs" find
      - name: Restore signed app and submission ID
        if: steps.checkpoint.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.checkpoint.outputs.artifact-name }}
          run-id: ${{ steps.checkpoint.outputs.run-id }}
          github-token: ${{ github.token }}
          path: apps/desktop/release/notary-checkpoint
      - name: Build and sign Apple Silicon app
        if: steps.checkpoint.outputs.found != 'true'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_FOR_PULL_REQUEST: "false"
        run: pnpm --dir apps/desktop dist --mac --arm64 --dir --publish never --config.forceCodeSigning=true --config.mac.notarize=false
      - name: Submit signed app without waiting
        if: steps.checkpoint.outputs.found != 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node "$RUNNER_TEMP/reviewer-release-tools/notarization-cli.mjs" submit
      - name: Save signed app and submission before waiting
        if: steps.checkpoint.outputs.found != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.checkpoint.outputs.artifact-name }}
          path: apps/desktop/release/notary-checkpoint/
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - name: Wait for Apple acceptance and staple ticket
        timeout-minutes: 70
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: node "$RUNNER_TEMP/reviewer-release-tools/notarization-cli.mjs" finish
      - name: Build installers from the accepted app
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          CSC_FOR_PULL_REQUEST: "false"
        run: pnpm --dir apps/desktop exec electron-builder --prepackaged release/mac-arm64/Slopbusters.app --mac dmg zip --arm64 --publish never --config.forceCodeSigning=true --config.mac.notarize=false
      - name: Verify signature, notarization, and packaged startup
        run: |
          app='apps/desktop/release/mac-arm64/Slopbusters.app'
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -dv --verbose=4 "$app" 2>&1 | grep -q 'Authority=Developer ID Application:'
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          node apps/desktop/scripts/smoke.mjs --executable="$PWD/$app/Contents/MacOS/Slopbusters"
          test -s apps/desktop/release/latest-mac.yml
          # Without the feed config every installed copy fails its update checks.
          grep -q '^provider: "github"$' "$app/Contents/Resources/app-update.yml"
      - name: Upload Apple rejection diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reviewer-notarization-diagnostics-${{ github.run_attempt }}
          path: apps/desktop/release/notarization-log.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: reviewer-mac-arm64
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest-mac.yml
          if-no-files-found: error
      - name: Publish release and update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$REVIEWER_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$REVIEWER_TAG" --json isDraft --jq .isDraft)" = true || {
              echo 'This version is already published. Release a new version instead.'
              exit 1
            }
          else
            gh release create "$REVIEWER_TAG" --verify-tag --draft \
              --title "Slopbusters Review ${REVIEWER_TAG#reviewer-v}" --generate-notes
          fi
          gh release upload "$REVIEWER_TAG" apps/desktop/release/*.dmg \
            apps/desktop/release/*.zip apps/desktop/release/*.blockmap \
            apps/desktop/release/latest-mac.yml --clobber
          gh release edit "$REVIEWER_TAG" --draft=false --latest
